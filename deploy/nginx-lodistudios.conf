# LodiStudios — nginx site config
# Install with deploy/setup-security.sh, or copy to
# /etc/nginx/sites-available/lodistudios and reload nginx.
#
# Changes from the previous config:
#   * /upload is behind HTTP Basic auth (was open to the whole internet)
#   * .zip/.sql/.bak/dotfiles are no longer downloadable from the web root
#   * dropped the dead /lodistudios/mediaplayer/* blocks, whose paths never
#     matched a real request
#   * dropped the alias directives: the URI already maps onto the root, so
#     /mediaplayer/x resolves to /var/www/lodistudios/mediaplayer/x directly
#   * added caching, gzip and standard security headers

server {
    listen 80;
    listen [::]:80;

    server_name 159.223.127.113 lodistudios.com www.lodistudios.com;

    root /var/www/lodistudios;
    index index.html;

    client_max_body_size 50M;

    # nginx add_header does not inherit into a location that sets its own,
    # so these are repeated in the locations below that add caching headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---- keep private files private ---------------------------------------
    # Site backups and server config were previously downloadable by anyone.
    location ~* \.(zip|tar|gz|tgz|bak|sql|log|env|conf)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }
    # ---- site -------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    location /mediaplayer/ {
        index player.html;
        try_files $uri $uri/ /mediaplayer/player.html;
    }

    # The service worker controls what browsers cache; it must never be a
    # stale copy itself, or an old build sticks around forever.
    location = /mediaplayer/serviceWorker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The catalogue changes on every upload.
    location = /mediaplayer/meta/index.json {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
    }

    # Audio and artwork are content-addressed by filename; cache them hard.
    location ~* ^/mediaplayer/(songs|albumart)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Backwards compatibility: older builds fetched /meta/index.json.
    location /meta/ {
        alias /var/www/lodistudios/mediaplayer/meta/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- uploader (password protected) ------------------------------------
    # Create the password file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-lodistudios yourname
    #
    # Routing here is exact-match on purpose. A broad `location /upload`
    # prefix sent GET /upload to the Node service, which only answers POST,
    # so visiting the page produced "Cannot GET /upload".

    # Typing the address without the trailing slash lands here.
    location = /upload {
        return 301 /upload/;
    }

    # The form itself.
    location = /upload/ {
        auth_basic "LodiStudios uploader";
        auth_basic_user_file /etc/nginx/.htpasswd-lodistudios;
        try_files /upload/uploader.html =404;
    }

    # Where the form POSTs. Only this path reaches the Node service.
    location = /upload/submit {
        auth_basic "LodiStudios uploader";
        auth_basic_user_file /etc/nginx/.htpasswd-lodistudios;

        proxy_pass http://127.0.0.1:3000/upload;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # The form's stylesheet. A regex location, so it outranks the plain
    # /upload/ prefix below.
    location ~ ^/upload/(uploader\.html|style\.css)$ {
        auth_basic "LodiStudios uploader";
        auth_basic_user_file /etc/nginx/.htpasswd-lodistudios;
    }

    # Everything else under /upload/ is server code, dependencies and scratch
    # files. A plain prefix, so the exact and regex matches above still win.
    location /upload/ {
        deny all;
        return 404;
    }

}

# ---- HTTPS -------------------------------------------------------------
# Once lodistudios.com points at this server, run:
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d lodistudios.com -d www.lodistudios.com
# Certbot rewrites this file to add the TLS block and the http->https
# redirect. All media paths are host-relative, so nothing breaks when the
# site moves to https.
